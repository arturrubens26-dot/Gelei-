# Netlify. O Next.js é detectado sozinho e roda pelo adaptador OpenNext (sem plugin para instalar).
# As variáveis (DATABASE_URL, SESSION_SECRET, APP_URL...) ficam no painel da Netlify, nunca aqui:
# a lista está no README, em "Publicar na Netlify".
[build]
  # O `prebuild` do package.json roda `prisma generate` antes (o cliente gerado não vai para o Git).
  command = "npm run build"
  publish = ".next"

[build.environment]
  # A mesma versão usada neste computador.
  NODE_VERSION = "24"
